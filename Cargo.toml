[package]
name = "yedit"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A tabbed notepad / markdown reader for the Yggdrasil ecosystem — the second libyggterm consumer"
repository = "https://github.com/yggdrasilhq/yedit"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dirs = "5"
serde_json = "1"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

[profile.release]
strip = true
lto = "thin"
