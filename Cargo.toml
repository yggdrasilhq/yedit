[package]
name = "yedit"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A tabbed notepad / markdown reader for the Yggdrasil ecosystem — the second libyggterm consumer"
repository = "https://github.com/yggdrasilhq/yedit"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dirs = "5"
serde_json = "1"
regex = "1"
# Bundled so the daemon never depends on a host libsqlite3 version; the
# drafts db is the crash-safety story (full-content rows, WAL).
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"

[profile.release]
strip = true
lto = "thin"
